<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>熊的书架</title>
<style>
:root{--bg:#f7f1e7;--ink:#4a3628;--muted:#9a8572;--accent:#b07a52;--accent-ink:#fff;--ghost:#efe4d4;--ghost-ink:#6b4a33;--paper:#fdf9f0;--bear-top:#ecdcc6;--bear-bottom:#e0caac;--bear-ink:#5a3f2c;--bear-board:#c09a74;--bunny-top:#fffaf7;--bunny-bottom:#fbedea;--bunny-ink:#8a5a50;--bunny-board:#efd0c9;--bear-note:#f4eadb;--bear-line:#9b7353;--bunny-note:#fdefeb;--bunny-line:#eab3aa;--bunny-mark:#fadfd8}
html,body{width:100%;min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}
*{box-sizing:border-box}
.app{min-height:100dvh;padding:var(--ai-phone-app-safe-top,88px) 16px var(--ai-phone-app-safe-bottom,24px)}
h1{font-size:22px;margin:0 0 4px;letter-spacing:1px}
h3{margin:0 0 8px}
h2.sec{font-size:15px;margin:24px 0 8px}
.sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.shelf{margin-bottom:26px;padding:14px 12px 0;border-radius:12px;box-shadow:0 2px 8px rgba(80,50,20,.08)}
.shelf.bear{background:linear-gradient(var(--bear-top),var(--bear-bottom));color:var(--bear-ink)}
.shelf.bunny{background:linear-gradient(var(--bunny-top),var(--bunny-bottom));color:var(--bunny-ink)}
.shelf h2{font-size:14px;margin:0 0 10px;font-weight:600}
.books{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;min-height:170px;padding:0 4px}
.board{height:10px;margin:0 -12px;border-radius:0 0 12px 12px}
.bear .board{background:var(--bear-board)}
.bunny .board{background:var(--bunny-board)}
.spine{flex:0 0 auto;width:44px;border-radius:5px 5px 2px 2px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:inset -4px 0 0 rgba(0,0,0,.07),0 -1px 3px rgba(0,0,0,.08)}
.spine .tt{writing-mode:vertical-rl;font-size:14px;letter-spacing:2px;line-height:1}
.spine .pg{font-size:10px;line-height:1.35;text-align:center;opacity:.8}
.empty{font-size:13px;opacity:.6;padding:20px 4px;align-self:center}
.card{background:#fffcf6;border:1px solid #ecdfcb;border-radius:10px;padding:10px 12px;margin-bottom:8px;line-height:1.7;font-size:14px}
.prog{font-size:13px;color:var(--ghost-ink);margin:4px 0}
.rv{background:var(--paper);border-radius:10px;padding:10px 12px;margin:6px 0 12px;line-height:1.8;font-size:14px;white-space:pre-wrap}
.rv.bear{border-left:3px solid var(--bear-line)}
.rv.none{color:var(--muted)}
button{font:inherit;min-height:40px;border:none;border-radius:10px;padding:0 14px;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:var(--ghost);color:var(--ghost-ink)}
button.danger{background:#d9776a;color:#fff}
button[disabled]{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.back{background:none;color:var(--accent);padding:0;min-height:32px}
input,textarea,select{font:inherit;width:100%;border:1px solid #e3d4bf;border-radius:8px;padding:8px;background:#fffdf9;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.chap{padding:10px 2px;border-bottom:1px dashed #e3d4bf;font-size:14px}
.paper{background:var(--paper);border-radius:12px;padding:18px 6px;box-shadow:0 2px 10px rgba(80,50,20,.07)}
.paper.reader,.paper:has(.reader p){background:none;border-radius:0;box-shadow:none;padding:6px 2px}
.reader p{line-height:1.9;font-size:15px;margin:0 0 12px;text-indent:2em;font-family:Georgia,'Songti SC',serif}
mark{background:none;color:inherit;border-radius:2px}
mark.bear{border-bottom:2px solid var(--bear-line)}
mark.bunny{background:var(--bunny-mark)}
.slip{margin:-4px 0 16px 22px;padding:8px 10px;font-size:13px;line-height:1.6;border-radius:4px;transform:rotate(-.6deg);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.slip.bear{background:var(--bear-note);color:var(--ink);border-left:3px solid var(--bear-line)}
.slip.bunny{background:var(--bunny-note);color:#8a4a45;border-left:3px solid var(--bunny-line);transform:rotate(.6deg)}
.slip .r{margin-top:5px;padding-top:5px;border-top:1px dashed rgba(0,0,0,.12)}
.who{font-size:11px;opacity:.7}
.nav{display:flex;justify-content:space-between;margin:16px 0}
.sheet-mask{position:fixed;inset:0;background:rgba(40,25,15,.3);display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:#fffcf7;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--ai-phone-app-safe-bottom,0px));display:none}
.show{display:block}
.note{background:#f8f0e4;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.6}
.reply{margin-left:18px;background:#fbf6ee}
.quote{font-size:13px;color:#7b6450;border-left:3px solid var(--bunny-line);padding-left:8px;margin:6px 0}
</style>
</head>
<body>
<div class='app' id='app'></div>
<div class='sheet-mask' id='mask'></div>
<div class='sheet' id='sheet'></div>
<script>
const api = window.AiPhone || window.AiPhoneApp;
const PART = 3000, MAXREAD = 3;
const WHO = { bear: '🐻 棕熊', bunny: '🐰 白兔' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' }[c])); }
const now = () => new Date().toISOString();
const arr = x => Array.isArray(x) ? x : (x && (x.items || x.records || x.list)) || [];
const rec = r => r && r.data && typeof r.data === 'object' ? Object.assign({}, r.data, { id: r.id }) : r;
const val = id => (document.getElementById(id) || {}).value || '';
async function list(col) { return arr(await api.db.list(col, { limit: 1000 })).map(rec); }
async function findBook(key) {
  const books = await list('books'); const k = String(key || '').trim();
  return books.find(b => b.id === k) || books.find(b => b.title === k) || books.find(b => k && b.title && b.title.includes(k)) || null;
}
async function chaptersOf(bookId) { return (await list('chapters')).filter(c => c.bookId === bookId).sort((a, b) => a.index - b.index); }
async function notesOf(bookId) { return (await list('notes')).filter(n => n.bookId === bookId).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')); }
async function reviewsOf(bookId) { return (await list('reviews')).filter(r => r.bookId === bookId); }
const prog = (b, who) => who === 'bunny' ? b.progressBunny : (b.progressBear || b.progress);
const progText = p => p ? '第' + p.chapter + '章' + (p.part ? '第' + p.part + '份' : '') : '还没翻开';

// ---------- 衣服 ----------
let PAL = {
  bear: [['#c49a72', '#fffaf2'], ['#d8b48c', '#4a3628'], ['#a9805d', '#fff6ea'], ['#e6cfae', '#5a3f2c'], ['#b98d66', '#fffaf2']],
  bunny: [['#f7d4cf', '#7a4c40'], ['#fde8de', '#8a5a4a'], ['#efc4ca', '#6b3f45'], ['#fff6ee', '#9a6a5a'], ['#f5dcc0', '#6b4a33']]
};
async function loadTheme() {
  try {
    const url = await api.app.getAssetUrl('assets/theme.json');
    const r = await fetch(url); if (!r.ok) return;
    const t = await r.json(); const c = t.colors || {};
    Object.keys(c).forEach(k => { if (c[k]) document.documentElement.style.setProperty('--' + k, c[k]); });
    if (Array.isArray(t.bearSpines) && t.bearSpines.length) PAL.bear = t.bearSpines;
    if (Array.isArray(t.bunnySpines) && t.bunnySpines.length) PAL.bunny = t.bunnySpines;
  } catch (e) {}
}

// ---------- 切书 ----------
async function readTxt(f) {
  const buf = await f.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) {}
  try { return new TextDecoder('gb18030').decode(buf); } catch (e) {}
  return new TextDecoder().decode(buf);
}
function stripGutenberg(t) {
  t = String(t || '').replace(/\r\n?/g, '\n');
  const s = t.search(/\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG[^\n]*/i);
  if (s >= 0) t = t.slice(t.indexOf('\n', s) + 1);
  const e = t.search(/\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG/i);
  if (e >= 0) t = t.slice(0, e);
  return t.trim();
}
function toParas(block) {
  const cjk = /[\u4e00-\u9fff]/.test(block);
  const blank = (block.match(/\n\s*\n/g) || []).length;
  const lineCount = block.split('\n').filter(l => l.trim()).length;
  if (lineCount > 1 && blank < lineCount / 4) return block.split('\n').map(p => p.trim()).filter(Boolean);
  return block.split(/\n\s*\n/).map(p => p.trim().replace(/\s*\n\s*/g, cjk ? '' : ' ')).filter(Boolean);
}
const norm = s => String(s || '').trim().replace(/\s+/g, ' ').replace(/[.:。：]$/, '').toLowerCase();
const isolated = (lines, i) => !!lines[i].trim() && (i === 0 || !lines[i - 1].trim() || lines[i].trim().length <= 30);
function locate(lines, heads) {
  const pos = []; let limit = lines.length;
  for (let h = heads.length - 1; h >= 0; h--) {
    const t = norm(heads[h]); if (!t) continue;
    for (let i = limit - 1; i >= 0; i--) { if (norm(lines[i]) === t && isolated(lines, i)) { pos.unshift({ i, title: lines[i].trim() }); limit = i; break; } }
  }
  return pos.length >= 2 ? pos : null;
}
function contents(lines) {
  const k = lines.findIndex(l => /^\s*(table of )?contents[.:]?\s*$/i.test(l) || /^\s*目\s*录\s*$/.test(l));
  if (k < 0) return [];
  const out = []; let blanks = 0;
  for (let i = k + 1; i < lines.length && out.length < 60; i++) {
    const l = lines[i].trim();
    if (!l) { if (out.length && ++blanks >= 3) break; continue; }
    blanks = 0; if (l.length > 80) break;
    out.push(l.replace(/[\s.·]+\d+$/, ''));
  }
  return out;
}
function build(lines, pos) {
  const out = [];
  const pre = lines.slice(0, pos[0].i).join('\n').trim();
  if (pre.length > 200) out.push({ title: '开头', paragraphs: toParas(pre) });
  pos.forEach((p, k) => {
    const body = lines.slice(p.i + 1, k + 1 < pos.length ? pos[k + 1].i : lines.length).join('\n');
    const paras = toParas(body); if (paras.length) out.push({ title: p.title, paragraphs: paras });
  });
  return out;
}
function splitChapters(text, given) {
  const lines = text.split('\n');
  const tries = [];
  if (given && given.length) tries.push(given);
  const toc = contents(lines); if (toc.length >= 2) tries.push(toc);
  for (const h of tries) { const pos = locate(lines, h); if (pos) { const out = build(lines, pos); if (out.length >= 2) return out; } }
  const strong = /^\s*((CHAPTER|Chapter|BOOK|Book|PART|Part)\s+[\dIVXLCivxlc]+\b.*|第[一二三四五六七八九十百千零〇\d]+[章回节卷].*)$/;
  const idx = []; lines.forEach((l, i) => { if (strong.test(l) && isolated(lines, i)) idx.push({ i, title: l.trim() }); });
  if (idx.length >= 2) { const out = build(lines, idx); if (out.length >= 2) return out; }
  const paras = toParas(text); const res = []; let cur = [], size = 0;
  paras.forEach(p => { cur.push(p); size += p.length; if (size > 8000) { res.push(cur); cur = []; size = 0; } });
  if (cur.length) res.push(cur);
  return res.map((p, i) => ({ title: '第' + (i + 1) + '节', paragraphs: p }));
}
function partsOf(paras) {
  const parts = []; let cur = [], size = 0;
  paras.forEach((p, i) => { if (size && size + p.length > PART) { parts.push(cur); cur = []; size = 0; } cur.push(i); size += p.length; });
  if (cur.length) parts.push(cur);
  return parts.length ? parts : [[]];
}
function posPart(chs, n) {
  const ch = chs[(n.chapter || 1) - 1]; if (!ch) return 1;
  let pi = n.paraIndex;
  if (pi == null || pi < 0) pi = (ch.paragraphs || []).findIndex(p => n.quote && p.includes(n.quote));
  const k = partsOf(ch.paragraphs || []).findIndex(p => p.includes(pi));
  return k >= 0 ? k + 1 : 1;
}
const headList = x => (Array.isArray(x) ? x : String(x || '').split(/\n|\|/)).map(s => String(s).trim()).filter(Boolean);

// ---------- 核心动作 ----------
async function addBookCore(a) {
  const title = String(a.title || '').trim(); if (!title) throw new Error('书名不能空着');
  const owner = a.owner === 'bunny' ? 'bunny' : 'bear';
  const exist = (await list('books')).find(b => b.title === title && b.owner === owner);
  if (exist) return { book: exist, existed: true };
  const book = await api.db.create('books', { title, author: a.author || '', summary: a.summary || '', source: a.source || '', owner, status: a.status || '想读', progressBear: null, progressBunny: null, bearFinished: false, hasText: false, chapterCount: 0, chapterTitles: [], createdAt: now() });
  return { book: rec(book), existed: false };
}
async function importText(book, raw, heads) {
  const text = stripGutenberg(raw);
  if (text.length < 50) throw new Error('正文太短，像是没拿到书');
  const chs = splitChapters(text, headList(heads));
  for (const c of await chaptersOf(book.id)) await api.db.delete('chapters', c.id);
  for (let i = 0; i < chs.length; i++) await api.db.create('chapters', { bookId: book.id, index: i + 1, title: chs[i].title, paragraphs: chs[i].paragraphs });
  await api.db.update('books', book.id, { hasText: true, chapterCount: chs.length, chapterTitles: chs.map(c => c.title), progress: null, progressBear: null, progressBunny: null, bearFinished: false, updatedAt: now() });
  return chs;
}
async function fetchText(url) {
  if (!/^https?:\/\/([a-z0-9-]+\.)*gutenberg\.org\//i.test(url)) throw new Error('现在只开了古腾堡（gutenberg.org）这一扇门');
  let res = null, err = '';
  try { res = await api.network.fetch({ url, method: 'GET', timeoutMs: 60000 }); } catch (e) { err = e.message || String(e); }
  if (!res || !res.ok || !res.text) { try { res = await api.network.fetch({ url, method: 'GET', proxy: true, timeoutMs: 110000 }); } catch (e) { err = e.message || String(e); } }
  if (!res || !res.ok || !res.text) throw new Error('下载失败' + (res ? '，状态 ' + res.status : '') + (err ? '：' + err : ''));
  return res.text;
}
async function readCore(a) {
  const who = a.who === 'bunny' ? 'bunny' : 'bear';
  const book = await findBook(a.bookId); if (!book) throw new Error('书架上找不到这本：' + a.bookId);
  if (!book.hasText) throw new Error('这本还没有正文，先导入');
  const before = prog(book, who);
  const chs = await chaptersOf(book.id);
  const ci = Math.max(1, Math.min(chs.length, Number(a.chapter) || 1));
  const ch = chs[ci - 1]; const parts = partsOf(ch.paragraphs || []);
  const pi = Math.max(1, Math.min(parts.length, Number(a.part) || 1));
  const cnt = Math.max(1, Math.min(MAXREAD, Number(a.count) || 1));
  const last = Math.min(parts.length, pi + cnt - 1);
  const text = [].concat(...parts.slice(pi - 1, last)).map(i => ch.paragraphs[i]).join('\n\n');
  const all = await notesOf(book.id);
  const notes = all.filter(n => n.chapter === ci);
  const roots = notes.filter(n => !n.replyTo && n.quote && text.includes(n.quote));
  const notesOut = roots.map(n => ({ id: n.id, quote: n.quote, by: n.author, text: n.text, replies: notes.filter(r => r.replyTo === n.id).map(r => ({ id: r.id, by: r.author, text: r.text })) }));
  const batch = new Set();
  roots.forEach(n => { batch.add(n.id); notes.filter(r => r.replyTo === n.id).forEach(r => batch.add(r.id)); });
  let hint = null;
  if (who === 'bear') {
    for (const n of all) if (batch.has(n.id) && n.author === 'bunny' && !n.seenByBear) await api.db.update('notes', n.id, { seenByBear: true });
    if (before) {
      const behind = all.filter(n => n.author === 'bunny' && !n.seenByBear && !batch.has(n.id) && (n.chapter < before.chapter || (n.chapter === before.chapter && posPart(chs, n) <= (before.part || 1))));
      if (behind.length) hint = '前面有兔子新留的纸条';
    }
  }
  const next = last < parts.length ? { chapter: ci, part: last + 1 } : (ci < chs.length ? { chapter: ci + 1, part: 1 } : null);
  const field = who === 'bunny' ? 'progressBunny' : 'progressBear';
  const upd = { status: book.status === '想读' ? '在读' : book.status, [field]: { chapter: ci, part: last, at: now() } };
  if (who === 'bear' && !next) upd.bearFinished = true;
  await api.db.update('books', book.id, upd);
  let bunnyReview;
  if (who === 'bear' && (!next || book.bearFinished)) { const r = (await reviewsOf(book.id)).find(x => x.author === 'bunny'); if (r) bunnyReview = r.text; }
  return { title: book.title, chapter: ci, chapterTitle: ch.title, chapterCount: chs.length, partFrom: pi, partTo: last, partCount: parts.length, text, notes: notesOut, next, finished: !next, hint, bunnyReview, otherReaderAt: prog(book, who === 'bear' ? 'bunny' : 'bear') || null };
}
async function addNoteCore(a) {
  const book = await findBook(a.bookId); if (!book) throw new Error('书架上找不到这本：' + a.bookId);
  const text = String(a.text || '').trim(); if (!text) throw new Error('批注是空的');
  let quote = String(a.quote || '').trim(), chapter = Number(a.chapter) || 1, warn = '', paraIndex = -1;
  const author = a.author === 'bunny' ? 'bunny' : 'bear';
  if (a.replyTo) {
    const parent = (await notesOf(book.id)).find(n => n.id === a.replyTo);
    if (!parent) throw new Error('找不到要回复的那条批注');
    quote = parent.quote; chapter = parent.chapter; paraIndex = parent.paraIndex == null ? -1 : parent.paraIndex;
  } else {
    if (!quote) throw new Error('要摘一句原文');
    const ch = (await chaptersOf(book.id))[chapter - 1];
    paraIndex = ch ? (ch.paragraphs || []).findIndex(p => p.includes(quote)) : -1;
    if (ch && paraIndex < 0) warn = '这一章里没找到这句原文，批注存了，但正文里不会标出来';
  }
  const n = await api.db.create('notes', { bookId: book.id, chapter, quote, text, author, replyTo: a.replyTo || '', paraIndex, seenByBear: author === 'bear', seenByBunny: author === 'bunny', createdAt: now() });
  return { note: rec(n), warn, book };
}
async function writeReviewCore(a) {
  const book = await findBook(a.bookId); if (!book) throw new Error('书架上找不到这本：' + a.bookId);
  const text = String(a.text || '').trim(); if (!text) throw new Error('读后感是空的');
  const author = a.author === 'bunny' ? 'bunny' : 'bear';
  const old = (await reviewsOf(book.id)).find(r => r.author === author);
  if (old) await api.db.update('reviews', old.id, { text, updatedAt: now() });
  else await api.db.create('reviews', { bookId: book.id, author, text, createdAt: now(), updatedAt: now() });
  return book;
}
async function bearReviews(key) {
  const book = await findBook(key); if (!book) throw new Error('书架上找不到这本：' + key);
  const rs = await reviewsOf(book.id);
  const mine = rs.find(r => r.author === 'bear'), hers = rs.find(r => r.author === 'bunny');
  return { title: book.title, bear: mine ? mine.text : null, bunny: hers ? (book.bearFinished ? hers.text : '兔子写了，熊读完最后一份才能看') : null };
}
const furthest = (b, mine) => Math.max(b.maxBunny || 0, mine ? mine.chapter || 0 : 0);
const unreadPaws = (b, notes, mine) => notes.filter(n => n.author === 'bear' && !n.seenByBunny && n.chapter <= furthest(b, mine));
function pawLine(b, notes, mine) { const u = unreadPaws(b, notes, mine); if (!u.length) return ''; const cs = [...new Set(u.map(n => n.chapter))].sort((x, y) => x - y); const ts = b.chapterTitles || []; return `<div class='prog'>🐾 熊回了你${u.length}张，在：${cs.map(c => esc(ts[c - 1] || ('第' + c + '章'))).join('、')}</div>`; }
function pawCh(b, notes, mine, c) { const k = unreadPaws(b, notes, mine).filter(n => n.chapter === c).length; return k ? ' 🐾' + k : ''; }
async function listCore(owner) {
  const books = (await list('books')).filter(b => !owner || b.owner === owner);
  const notes = await list('notes');
  return books.map(b => ({ id: b.id, title: b.title, author: b.author, owner: b.owner, status: b.status, bearAt: prog(b, 'bear') || null, bunnyAt: prog(b, 'bunny') || null, bearFinished: !!b.bearFinished, hasText: !!b.hasText, chapterCount: b.chapterCount || 0, chapterTitles: b.chapterTitles || [], notes: notes.filter(n => n.bookId === b.id).length, summary: b.summary }));
}

// ---------- 给聊天用的工具 ----------
if (api && api.tools) {
  const wrap = fn => async a => { try { return await fn(a || {}); } catch (e) { return { success: false, error: e.message || String(e) }; } };
  api.tools.handle('addBook', wrap(async a => { const r = await addBookCore(a); return { success: true, data: { bookId: r.book.id, title: r.book.title, owner: r.book.owner, existed: r.existed }, userNotice: r.existed ? '这本已经在书架上了' : '《' + r.book.title + '》上架了' }; }));
  api.tools.handle('importFromUrl', wrap(async a => {
    const book = await findBook(a.bookId); if (!book) throw new Error('书架上找不到这本：' + a.bookId);
    const url = String(a.url || '').trim();
    const chs = await importText(book, await fetchText(url), a.headings);
    await api.db.update('books', book.id, { source: url });
    return { success: true, data: { bookId: book.id, chapters: chs.map((c, i) => (i + 1) + '. ' + c.title + '（' + partsOf(c.paragraphs).length + '份）') }, userNotice: '《' + book.title + '》导入了' + chs.length + '章' };
  }));
  api.tools.handle('readSection', wrap(async a => ({ success: true, data: await readCore(Object.assign({}, a, { who: 'bear' })) })));
  api.tools.handle('addNote', wrap(async a => { const r = await addNoteCore(a); return { success: true, data: { noteId: r.note.id, book: r.book.title, chapter: r.note.chapter, quote: r.note.quote, warn: r.warn || undefined }, userNotice: (r.note.author === 'bunny' ? '白兔' : '棕熊') + '在《' + r.book.title + '》里留了一张小纸条' }; }));
  api.tools.handle('writeReview', wrap(async a => { const b = await writeReviewCore(a); return { success: true, data: { book: b.title }, userNotice: (a.author === 'bunny' ? '白兔' : '棕熊') + '写了《' + b.title + '》的读后感' }; }));
  api.tools.handle('readReviews', wrap(async a => ({ success: true, data: await bearReviews(a.bookId) })));
  api.tools.handle('listShelf', wrap(async a => ({ success: true, data: { books: await listCore(a.owner) } })));
}

// ---------- 页面 ----------
const $app = document.getElementById('app'), $sheet = document.getElementById('sheet'), $mask = document.getElementById('mask');
let view = { name: 'home' };
function openSheet(html) { $sheet.innerHTML = html; $sheet.classList.add('show'); $mask.classList.add('show'); }
function closeSheet() { $sheet.classList.remove('show'); $mask.classList.remove('show'); }
if ($mask) $mask.onclick = closeSheet;
const toast = m => { try { api.ui.toast(m); } catch (e) {} };
function go(v) { view = v; render().catch(e => { $app.innerHTML = `<p>出错了：${esc(e.message)}</p>`; }); }
async function render() { if (view.name === 'book') return renderBook(); if (view.name === 'read') return renderRead(); return renderHome(); }
async function renderHome() {
  const books = await listCore();
  const shelf = (owner, name) => {
    const bs = books.filter(b => b.owner === owner); const pal = PAL[owner];
    const spines = bs.map((b, k) => { const c = pal[k % pal.length]; const h = Math.max(140, b.title.length * 17 + 64); return `<div class='spine' data-book='${esc(b.id)}' style='background:${esc(c[0])};color:${esc(c[1])};height:${h}px'><span class='tt'>${esc(b.title)}</span><div class='pg'>🐻${b.bearAt ? b.bearAt.chapter : '·'}<br>🐰${b.bunnyAt ? b.bunnyAt.chapter : '·'}</div></div>`; }).join('');
    return `<div class='shelf ${owner}'><h2>${name}</h2><div class='books'>${spines || `<div class='empty'>这一层还空着</div>`}</div><div class='board'></div></div>`;
  };
  $app.innerHTML = `<h1>熊的书架</h1><div class='sub'>咕嘟的熊和兔 · 可以互相偷看</div>` + shelf('bear', '🐻 熊的那层') + shelf('bunny', '🐰 兔子的那层') + `<div class='row'><button id='imp'>导入 txt</button><button class='ghost' id='add'>＋ 手写一本</button></div>`;
  $app.onclick = null;
  $app.querySelectorAll('[data-book]').forEach(el => el.onclick = () => go({ name: 'book', id: el.dataset.book }));
  document.getElementById('add').onclick = addSheet;
  document.getElementById('imp').onclick = txtSheet;
}
function txtSheet() {
  openSheet(`<h3>导入一本 txt</h3><label>选文件</label><input type='file' id='t-file' accept='.txt,text/plain'><label>书名（先用文件名，可以改）</label><input id='t-title'><label>作者（可以不填）</label><input id='t-author'><label>放在哪一层</label><select id='t-owner'><option value=''>挑一层</option><option value='bunny'>🐰 兔子的那层</option><option value='bear'>🐻 熊的那层</option></select><label>章节标题（可以不填，一行一个，填了切得更准）</label><textarea id='t-heads'></textarea><div class='row'><button id='t-ok'>导进来</button><button class='ghost' id='t-x'>算了</button></div>`);
  const $f = document.getElementById('t-file');
  $f.onchange = () => { const f = $f.files[0]; if (f) document.getElementById('t-title').value = f.name.replace(/\.txt$/i, ''); };
  document.getElementById('t-x').onclick = closeSheet;
  document.getElementById('t-ok').onclick = async () => {
    const f = $f.files[0]; if (!f) return toast('还没选文件');
    const owner = val('t-owner'); if (!owner) return toast('先挑一层');
    try {
      toast('在切，稍等');
      const r = await addBookCore({ title: val('t-title').trim() || f.name.replace(/\.txt$/i, ''), author: val('t-author'), owner });
      const chs = await importText(r.book, await readTxt(f), val('t-heads'));
      closeSheet(); toast('导入了' + chs.length + '章'); go({ name: 'book', id: r.book.id });
    } catch (e) { toast(e.message); }
  };
}
function addSheet() {
  openSheet(`<h3>手写一本</h3><label>书名</label><input id='f-title'><label>作者</label><input id='f-author'><label>放在哪一层</label><select id='f-owner'><option value='bunny'>🐰 兔子的那层</option><option value='bear'>🐻 熊的那层</option></select><label>简介（可以不填）</label><textarea id='f-sum'></textarea><div class='row'><button id='f-ok'>放上去</button><button class='ghost' id='f-x'>算了</button></div>`);
  document.getElementById('f-x').onclick = closeSheet;
  document.getElementById('f-ok').onclick = async () => {
    try { const r = await addBookCore({ title: val('f-title'), author: val('f-author'), owner: val('f-owner'), summary: val('f-sum') }); closeSheet(); toast(r.existed ? '这本已经在了' : '上架了'); go({ name: 'book', id: r.book.id }); } catch (e) { toast(e.message); }
  };
}
async function renderBook() {
  const b = await findBook(view.id); if (!b) return go({ name: 'home' });
  const chs = b.hasText ? (b.chapterTitles || []) : [];
  const notes = await notesOf(b.id);
  const rs = await reviewsOf(b.id);
  const rb = rs.find(r => r.author === 'bear'), rn = rs.find(r => r.author === 'bunny');
  const mine = prog(b, 'bunny');
  $app.onclick = null;
  $app.innerHTML = `<button class='back' id='bk'>‹ 书架</button><h1>《${esc(b.title)}》</h1><div class='sub'>${esc(b.author || '佚名')} · ${b.owner === 'bear' ? '🐻 熊的那层' : '🐰 兔子的那层'} · ${notes.length}张小纸条</div>` + (b.summary ? `<div class='card'>${esc(b.summary)}</div>` : '') + `<div class='prog'>🐻 熊读到：${b.bearFinished ? '读完了' : progText(prog(b, 'bear'))}</div><div class='prog'>🐰 兔子读到：${progText(mine)}</div><label>书名</label><input id='nm' value='${esc(b.title)}'><label>状态</label><select id='st'>${['想读', '在读', '读完'].map(s => `<option ${s === b.status ? 'selected' : ''}>${s}</option>`).join('')}</select><div class='row'>` + (b.hasText ? `<button id='rd'>${mine ? '接着读' : '翻开'}</button>` : '') + `<button class='ghost' id='im'>${b.hasText ? '重新导入正文' : '导入正文'}</button><button class='danger' id='del'>拿下书架</button></div>` + chs.map((t, i) => `<div class='chap' data-ch='${i + 1}'>${i + 1}. ${esc(t)}</div>`).join('') + `<h2 class='sec'>读后感</h2><div class='who'>🐻 棕熊</div><div class='rv bear ${rb ? '' : 'none'}'>${rb ? esc(rb.text) : '熊还没写'}</div><div class='who'>🐰 白兔${b.bearFinished ? '' : ' · 熊读完这本才看得到'}</div><textarea id='rvn'>${rn ? esc(rn.text) : ''}</textarea><div class='row'><button id='rvok'>存下读后感</button></div>`;
  document.getElementById('bk').onclick = () => go({ name: 'home' });
  document.getElementById('nm').onchange = async e => { const t = e.target.value.trim(); if (!t) return; await api.db.update('books', b.id, { title: t }); toast('改好了'); };
  document.getElementById('st').onchange = async e => { await api.db.update('books', b.id, { status: e.target.value }); toast('改好了'); };
  const rd = document.getElementById('rd'); if (rd) rd.onclick = () => go({ name: 'read', id: b.id, chapter: mine ? mine.chapter : 1 });
  document.getElementById('im').onclick = () => importSheet(b);
  document.getElementById('rvok').onclick = async () => { try { await writeReviewCore({ bookId: b.id, text: val('rvn'), author: 'bunny' }); toast('存好了'); } catch (e) { toast(e.message); } };
  document.getElementById('del').onclick = async () => {
    const ok = await api.ui.confirm({ title: '拿下书架？', message: '这本书的正文、小纸条和读后感会一起删掉。' });
    if (!ok) return;
    for (const n of notes) await api.db.delete('notes', n.id);
    for (const r of rs) await api.db.delete('reviews', r.id);
    for (const c of await chaptersOf(b.id)) await api.db.delete('chapters', c.id);
    await api.db.delete('books', b.id); go({ name: 'home' });
  };
  $app.querySelectorAll('[data-ch]').forEach(el => el.onclick = () => go({ name: 'read', id: b.id, chapter: Number(el.dataset.ch) }));
}
function importSheet(b) {
  openSheet(`<h3>给《${esc(b.title)}》导入正文</h3><label>古腾堡 txt 网址</label><input id='i-url' placeholder='https://www.gutenberg.org/cache/epub/…/pg….txt'><label>章节标题（可以不填，一行一个，填了切得更准）</label><textarea id='i-heads'></textarea><div class='row'><button id='i-go'>从网址拉</button></div><label>或者选一个 txt 文件</label><input type='file' id='i-file' accept='.txt,text/plain'><label>或者直接粘贴正文</label><textarea id='i-paste'></textarea><div class='row'><button id='i-ok'>用文件或粘贴的</button><button class='ghost' id='i-x'>算了</button></div>`);
  const done = async (raw, url) => { try { const chs = await importText(b, raw, val('i-heads')); if (url) await api.db.update('books', b.id, { source: url }); closeSheet(); toast('导入了' + chs.length + '章'); go({ name: 'book', id: b.id }); } catch (e) { toast(e.message); } };
  document.getElementById('i-x').onclick = closeSheet;
  document.getElementById('i-go').onclick = async () => { const url = val('i-url').trim(); try { toast('在拉，稍等'); await done(await fetchText(url), url); } catch (e) { toast(e.message); } };
  document.getElementById('i-ok').onclick = async () => {
    const f = document.getElementById('i-file').files[0];
    if (f) return done(await readTxt(f));
    if (val('i-paste').trim()) return done(val('i-paste'));
    toast('还没选文件，也没粘贴');
  };
}
async function renderRead() {
  const b = await findBook(view.id); if (!b) return go({ name: 'home' });
  const chs = await chaptersOf(b.id); if (!chs.length) return go({ name: 'book', id: b.id });
  const ci = Math.max(1, Math.min(chs.length, view.chapter || 1));
  const ch = chs[ci - 1];
  const notes = (await notesOf(b.id)).filter(n => n.chapter === ci);
  const roots = notes.filter(n => !n.replyTo);
  const paras = ch.paragraphs || [];
  const used = new Set();
  const html = paras.map((p, i) => {
    const here = roots.filter(n => n.quote && p.includes(n.quote));
    const ranges = here.map(n => { const k = p.indexOf(n.quote); return { s: k, e: k + n.quote.length, n }; }).sort((x, y) => x.s - y.s);
    let out = '', pos = 0;
    ranges.forEach(r => { if (r.s < pos) return; out += esc(p.slice(pos, r.s)) + `<mark class='${r.n.author}' data-note='${esc(r.n.id)}'>` + esc(p.slice(r.s, r.e)) + '</mark>'; pos = r.e; });
    out += esc(p.slice(pos));
    const slips = here.map(n => { used.add(n.id); const reps = notes.filter(r => r.replyTo === n.id); return `<div class='slip ${n.author}' data-note='${esc(n.id)}'><div class='who'>${WHO[n.author] || ''}</div>${esc(n.text)}${reps.map(r => `<div class='r'><span class='who'>${WHO[r.author] || ''}</span> ${esc(r.text)}</div>`).join('')}</div>`; }).join('');
    return `<p data-p='${i}'>${out}</p>${slips}`;
  }).join('');
  const lost = roots.filter(n => !used.has(n.id));
  const bear = prog(b, 'bear');
  $app.innerHTML = `<button class='back' id='bk'>‹ 《${esc(b.title)}》</button><h1 style='font-size:18px'>${esc(ch.title)}</h1><div class='sub'>第${ci}/${chs.length}章 · 点一段可以贴小纸条，点纸条可以回一句${bear ? ' · 🐻 熊读到第' + bear.chapter + '章' : ''}</div><div class='paper reader' id='reader'>${html}</div>` + (lost.length ? `<h2 style='font-size:15px'>找不到原句的纸条</h2>` + lost.map(n => `<div class='slip ${n.author}' data-note='${esc(n.id)}'><div class='quote'>${esc(n.quote)}</div>${esc(n.text)}</div>`).join('') : '') + `<div class='nav'><button class='ghost' id='pv' ${ci <= 1 ? 'disabled' : ''}>上一章</button><button class='ghost' id='nx' ${ci >= chs.length ? 'disabled' : ''}>下一章</button></div>`;
  const savedPara = b.progressBunny && b.progressBunny.chapter === ci ? b.progressBunny.para : null;
  const tgt = savedPara != null ? document.querySelector("#reader [data-p='" + savedPara + "']") : null;
  if (tgt) tgt.scrollIntoView({ block: 'start' }); else { window.scrollTo(0, 0); if (document.scrollingElement) document.scrollingElement.scrollTop = 0; if ($app) $app.scrollTop = 0; }
  const topPara = () => { const ps = document.querySelectorAll('#reader [data-p]'); for (const p of ps) { if (p.getBoundingClientRect().bottom > 60) return +p.dataset.p; } return 0; };
  let rdTm = null;
  const savePos = () => { if (!document.getElementById('reader')) return; api.db.update('books', b.id, { progressBunny: { chapter: ci, part: partsOf(paras).length, para: topPara(), at: now() } }).catch(() => {}); };
  if (window.__rdScroll) { window.removeEventListener('scroll', window.__rdScroll, true); document.removeEventListener('visibilitychange', window.__rdVis); }
  window.__rdScroll = () => { clearTimeout(rdTm); rdTm = setTimeout(savePos, 800); };
  window.__rdVis = () => { if (document.hidden) savePos(); };
  window.addEventListener('scroll', window.__rdScroll, true);
  document.addEventListener('visibilitychange', window.__rdVis);
  await api.db.update('books', b.id, { status: b.status === '想读' ? '在读' : b.status, progressBunny: { chapter: ci, part: partsOf(paras).length, para: tgt ? savedPara : 0, at: now() } });
  document.getElementById('bk').onclick = () => go({ name: 'book', id: b.id });
  document.getElementById('pv').onclick = () => go({ name: 'read', id: b.id, chapter: ci - 1 });
  document.getElementById('nx').onclick = () => go({ name: 'read', id: b.id, chapter: ci + 1 });
  const openThread = id => { const root = roots.find(n => n.id === id); if (root) threadSheet(b, ci, root, notes); };
  $app.onclick = e => {
    const s = e.target.closest('[data-note]'); if (s) return openThread(s.dataset.note);
    const p = e.target.closest('p[data-p]'); if (p) noteSheet(b, ci, paras[Number(p.dataset.p)] || '');
  };
}
function threadSheet(b, ci, root, notes) {
  const items = [root].concat(notes.filter(r => r.replyTo === root.id));
  openSheet(`<div class='quote'>${esc(root.quote)}</div>` + items.map((n, i) => `<div class='note ${i ? 'reply' : ''}'><div class='who'>${WHO[n.author] || ''} · ${esc((n.createdAt || '').slice(0, 10))}</div>${esc(n.text)}</div>`).join('') + `<label>回一句</label><textarea id='r-text'></textarea><div class='row'><button id='r-ok'>回给它</button><button class='ghost' id='r-x'>关上</button></div>`);
  document.getElementById('r-x').onclick = closeSheet;
  document.getElementById('r-ok').onclick = async () => { try { await addNoteCore({ bookId: b.id, chapter: ci, text: val('r-text'), author: 'bunny', replyTo: root.id }); closeSheet(); go({ name: 'read', id: b.id, chapter: ci }); } catch (e) { toast(e.message); } };
}
function noteSheet(b, ci, para) {
  openSheet(`<h3>贴一张小纸条</h3><label>摘哪一句（可以删到只剩那一句）</label><textarea id='n-q'>${esc(para)}</textarea><label>想说什么</label><textarea id='n-t'></textarea><div class='row'><button id='n-ok'>贴上</button><button class='ghost' id='n-x'>算了</button></div>`);
  document.getElementById('n-x').onclick = closeSheet;
  document.getElementById('n-ok').onclick = async () => { try { const r = await addNoteCore({ bookId: b.id, chapter: ci, quote: val('n-q').trim(), text: val('n-t'), author: 'bunny' }); closeSheet(); if (r.warn) toast(r.warn); go({ name: 'read', id: b.id, chapter: ci }); } catch (e) { toast(e.message); } };
}
if ($app && api) loadTheme().finally(() => go({ name: 'home' }));
</script>
